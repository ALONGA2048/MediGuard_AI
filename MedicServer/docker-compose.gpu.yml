services:
  yolo:
    build:
      context: .
      dockerfile: yolo_service/Dockerfile.gpu
    environment:
      YOLO_DEVICE: ${YOLO_GPU_DEVICE:-cuda:0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  ocr:
    build:
      context: .
      dockerfile: ocr_service/Dockerfile.gpu
    environment:
      # CUDA_VISIBLE_DEVICES inside the container. Keep this independent from
      # OCR_DEVICE=cpu in the normal .env so the CPU compose remains usable.
      OCR_DEVICE: ${OCR_GPU_DEVICE:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
